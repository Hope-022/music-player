<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>"
    />
    <title>Music Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <!-- Player card -->
      <section class="player" aria-label="Music player">
        <p class="player__label">Now Playing</p>

        <div class="player__cover">
          <img
            id="cover"
            src="assets/images/chill-lofi.jpg"
            alt="Album cover"
          />
        </div>

        <h1 id="title" class="player__title">Song title</h1>
        <p id="artist" class="player__artist">Artist name</p>

        <div class="progress">
          <span id="current-time">0:00</span>
          <input
            id="progress-bar"
            type="range"
            min="0"
            max="100"
            value="0"
            aria-label="Seek"
          />
          <span id="duration">0:00</span>
        </div>

        <div class="controls">
          <button id="prev" class="btn" aria-label="Previous song">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z" />
            </svg>
          </button>

          <button id="play" class="btn btn--play" aria-label="Play">
            <svg
              id="icon-play"
              viewBox="0 0 24 24"
              width="28"
              height="28"
              fill="currentColor"
            >
              <path d="M8 5v14l11-7z" />
            </svg>
          </button>

          <button id="next" class="btn" aria-label="Next song">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" />
            </svg>
            <svg
              id="icon-pause"
              viewBox="0 0 24 24"
              width="28"
              height="28"
              fill="currentColor"
              hidden
            >
              <rect x="6" y="5" width="3.5" height="14" rx="1.5" />
              <rect x="14.5" y="5" width="3.5" height="14" rx="1.5" />
            </svg>
          </button>
        </div>

        <div class="volume">
          <svg
            viewBox="0 0 24 24"
            width="20"
            height="20"
            fill="currentColor"
            aria-hidden="true"
          >
            <path
              d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02z"
            />
          </svg>
          <input
            id="volume"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="0.7"
            aria-label="Volume"
          />
        </div>
      </section>

      <!-- Playlist (filled in by JavaScript) -->
      <aside class="playlist" aria-label="Playlist">
        <h2 class="playlist__heading">Playlist</h2>
        <ul id="playlist" class="playlist__list"></ul>
      </aside>
    </main>

    <script src="script.js"></script>
  </body>
</html>
